<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DESIGN-003 exploration</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#172036;background:#f6f7fb}
    body{overflow:hidden}.top{height:28px;padding:0 60px;display:flex;align-items:center;justify-content:space-between;background:#eceef5;color:#59647c;font-size:10px}
    header{height:76px;padding:0 60px;display:flex;align-items:center;gap:20px;background:#fff;border-bottom:1px solid #e0e4ee}
    .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:2px}.mark{width:34px;height:34px;border-radius:10px;background:#5147e5;color:#fff;display:grid;place-items:center}.search{height:44px;flex:1;border:1px solid #dce1eb;border-radius:13px;padding:13px 16px;color:#8a93a7;background:#fafbfe}.cart{font-size:12px;color:#6c758a;font-weight:650}
    nav{height:40px;padding:0 60px;display:flex;align-items:center;gap:32px;background:#fff;border-bottom:1px solid #e0e4ee;font-size:11px}.catalog-trigger{height:40px;border:0;background:none;color:#5147e5;font-weight:750;padding:0}.crumb{max-width:1320px;margin:0 auto;padding:25px 0 16px;font-size:11px;color:#68738b}
    main{max-width:1320px;margin:auto}.eyebrow{font-size:10px;letter-spacing:1.5px;color:#5147e5;font-weight:800}.heading{display:flex;align-items:end;justify-content:space-between;border-bottom:1px solid #dde2ec;padding-bottom:14px}.heading h1{font-size:38px;line-height:1.05;margin:9px 0 0;letter-spacing:-1.6px}.count{font-size:11px;color:#68738b}.products{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.card{height:210px;padding:10px;background:#fff;border-radius:16px}.pic{height:130px;border-radius:11px;background:linear-gradient(135deg,#e7e9ef,#f0ece9)}.name{margin-top:13px;font-size:11px;font-weight:750}.price{margin-top:8px;font-size:10px;color:#647087}
    .panel{position:absolute;z-index:4;left:60px;top:180px;width:1040px;padding:20px;background:#fff;border:1px solid #d8deea;border-radius:20px;box-shadow:0 24px 48px #24304f20}.panel-head{display:flex;justify-content:space-between;align-items:start;padding-bottom:14px;border-bottom:1px solid #e1e5ed}.panel h2{margin:5px 0 0;font-size:18px}.close{min-width:72px;height:36px;border:0;border-radius:10px;background:#f5f6fa;color:#556178}.groups{display:grid;grid-template-columns:repeat(3,1fr);gap:0 20px;margin-top:14px}.group{min-height:43px;padding:12px 8px;border:0;border-bottom:1px solid #e5e8ef;background:#fff;text-align:left;color:#344057;font-weight:650;font-size:11px}.group.selected{color:#4438df;background:#f0efff;border-left:4px solid #5147e5}.group.focus{outline:3px solid #756cf0;outline-offset:2px;border-radius:5px}.group.hover{background:#f5f6ff}.panel-foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:9px;color:#778096}.all{color:#5147e5;font-weight:800}
    .scrim{display:none}.sheet{display:none}.state-card{min-height:218px;margin-top:16px;border:1px solid #e0e4ed;border-radius:17px;background:#fff;padding:26px;display:grid;place-items:center;text-align:center}.state-card.error{border-color:#e9c6c1;background:#fffafa}.state-card h3{margin:0 0 8px;font-size:18px}.state-card p{margin:0;color:#6a7489;font-size:12px;line-height:1.5}.action{margin-top:16px;height:42px;border:0;border-radius:11px;padding:0 18px;background:#5147e5;color:#fff;font-weight:750}.skeleton{height:210px;border-radius:16px;background:#fff;padding:10px}.bone{border-radius:10px;background:#e9ebf2}.bone.image{height:130px}.bone.line{height:10px;margin-top:14px;width:76%}.bone.short{width:35%;margin-top:9px}.status{grid-column:1/-1;height:32px;padding:8px 12px;border-radius:10px;background:#eeedff;color:#4438df;font-size:11px;font-weight:700}.previous{opacity:.45;filter:saturate(.35);pointer-events:none}.notice{margin-top:14px;padding:12px 16px;border:1px solid #bbb6f3;background:#f8f7ff;border-radius:12px;color:#4438df;font-size:11px;font-weight:700}
    .matrix{padding:22px;background:#f3f5fa;min-height:100vh}.matrix-title{display:flex;justify-content:space-between;align-items:end;margin-bottom:14px}.matrix-title h1{margin:0;font-size:25px}.matrix-title span{font-size:10px;color:#6f7890}.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.tile{height:204px;border:1px solid #dde2ec;border-radius:14px;background:#fff;padding:14px;position:relative;overflow:hidden}.tile h2{font-size:12px;margin:0 0 10px}.minihead{height:11px;width:60%;border-radius:4px;background:#182136}.miniline{height:6px;border-radius:3px;background:#e7e9f0;margin-top:8px}.minicards{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin-top:12px}.minicard{height:66px;border-radius:7px;background:#edf0f5;border:5px solid #fafbfc}.minierror{margin-top:14px;padding:13px 8px;border:1px solid #edc7c0;background:#fff7f5;border-radius:9px;color:#8d4138;font-size:9px}.miniaction{display:inline-block;margin-top:7px;padding:6px 8px;border-radius:6px;background:#5147e5;color:#fff}.tag{position:absolute;right:10px;bottom:9px;font-size:8px;color:#737d92}.interaction{padding:24px;background:#f4f6fb;min-height:100vh}.interaction h1{font-size:26px;margin:0 0 18px}.interaction-grid{display:grid;grid-template-columns:1.4fr .9fr;gap:14px}.demo,.notes{border:1px solid #dce1eb;border-radius:18px;background:#fff;padding:20px}.demo h2,.notes h2{margin:0 0 15px;font-size:15px}.states{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.sample{padding:11px;border:1px solid #e2e5ed;border-radius:10px;font-size:11px}.sample.hover{background:#f5f6ff}.sample.focus{outline:3px solid #756cf0;outline-offset:2px}.sample.selected{border-left:5px solid #5147e5;background:#efeeff;color:#4338d4;font-weight:750}.flow{margin-top:16px;padding:15px;border-radius:13px;background:#f1f0ff;color:#4438df;font-size:11px;line-height:1.7}.notes ol{margin:0;padding-left:18px;color:#58647a;font-size:11px;line-height:1.7}.callout{margin-top:15px;border-left:4px solid #5147e5;padding:10px 12px;background:#f7f7ff;font-size:10px;line-height:1.5}
    @media(max-width:600px){
      .top,.search,.cart{display:none}header{height:58px;padding:0 13px}.brand{font-size:12px}.mark{width:36px;height:36px}nav{height:38px;padding:0 13px}.crumb{padding:17px 13px 13px}.panel{display:none}main{padding:0 13px}.heading h1{font-size:29px;line-height:1.2}.products{grid-template-columns:repeat(2,1fr);gap:8px}.card,.skeleton{height:185px}.pic,.bone.image{height:108px}.card:nth-child(n+3),.skeleton:nth-child(n+4){display:none}.scrim{display:block;position:absolute;inset:0;background:#151a2c66;z-index:5}.sheet{display:block;position:absolute;left:12px;right:12px;bottom:12px;z-index:6;max-height:660px;height:82vh;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 30px 70px #17203645}.sheet .panel-head{position:sticky;top:0;background:#fff;z-index:1;padding:18px 16px 13px}.sheet h2{margin:5px 0 0;font-size:20px}.sheet .groups{display:block;margin:0;padding:6px 15px 18px;max-height:calc(82vh - 82px);overflow:auto}.sheet .group{display:block;width:100%;min-height:48px;font-size:11px;line-height:1.4;padding:14px 8px}.sheet .close{min-width:44px}.matrix{padding:13px}.matrix-title{margin-bottom:10px}.matrix-title h1{font-size:19px}.tiles{grid-template-columns:repeat(2,1fr);gap:7px}.tile{height:176px;padding:10px}.tile h2{font-size:10px}.minicard{height:48px}.interaction{padding:13px}.interaction h1{font-size:20px;margin-bottom:10px}.interaction-grid{display:block}.demo,.notes{padding:14px;border-radius:14px}.states{gap:7px}.sample{font-size:9px;padding:9px}.notes{margin-top:8px}.notes ol{font-size:9px;line-height:1.45}.flow{font-size:9px;padding:10px;margin-top:10px}.callout{margin-top:9px;padding:7px;font-size:8px}
    }
  </style>
</head>
<body>
<script>
const q=new URLSearchParams(location.search),variant=q.get('variant')||'a',artifact=q.get('artifact')||'overview',mobile=innerWidth<600;
const groups=['Все товары','Компьютеры и ноутбуки','Смартфоны и гаджеты','Телевизоры, аудио и домашние кинотеатры','Крупная бытовая техника','Техника для кухни','Климатическая техника','Инструменты и садовая техника','Автотовары и навигационное оборудование','Игры, консоли и развлечения','Красота и здоровье','Товары для дома и умного освещения'];
const cards=['Смартфон Orbit Pro','Наушники Pulse Studio','Смарт-часы Nova Watch','Планшет Orbit Tab'];
function shell(){
return `<div class=top><span>${variant==='a'?'A · Context shield':'B · Confirmed transition'}</span><span>Москва · Доставка сегодня</span></div><header><div class=brand><span class=mark>✦</span>НОРВИ</div><div class=search>Найти товар или категорию</div><div class=cart>Корзина</div></header><nav><button class=catalog-trigger>Каталог</button><span>Новинки</span><span>Для дома</span><span>Поддержка</span></nav><div class=crumb>Главная　<b>Каталог</b></div>`;
}
function options(sheet=false){return groups.map((g,i)=>`<button class="group ${i===2?'selected':''} ${i===1?'hover':''} ${i===3?'focus':''}">${i===2?'✓ ':''}${g}</button>`).join('')}
function nav(open=true){if(!open)return''; if(mobile)return `<div class=scrim></div><section class=sheet role=dialog><div class=panel-head><div><div class=eyebrow>КАТАЛОГ ТОВАРОВ</div><h2>Выберите категорию</h2></div><button class=close>×</button></div><div class=groups>${options(true)}</div></section>`;return `<section class=panel><div class=panel-head><div><div class=eyebrow>КАТАЛОГ ТОВАРОВ</div><h2>Выберите категорию</h2></div><button class=close>Esc　Закрыть</button></div><div class=groups>${options()}</div><div class=panel-foot><span>↑↓ выбор · Enter применить</span><span class=all>Все товары</span></div></section>`}
function productCards(extra=''){return cards.map((c,i)=>`<article class="card ${extra}"><div class=pic></div><div class=name>${c}</div><div class=price>${[74490,18490,24990,49990][i].toLocaleString('ru')} ₽</div></article>`).join('')}
function skeletons(){return cards.map(()=>`<div class=skeleton><div class="bone image"></div><div class="bone line"></div><div class="bone line short"></div></div>`).join('')}
function overview(){let refetch=q.get('state')==='refetch';return shell()+nav(true)+`<main><div class=eyebrow>ПОДБОРКА НОРВИ</div><div class=heading><h1>Смартфоны и гаджеты</h1><span class=count>${refetch?'Обновляем…':'68 товаров'}</span></div>${refetch&&variant==='b'?'<div class=notice>Загружаем «Техника для кухни» · ниже предыдущая подборка</div>':''}<div class=products>${refetch&&variant==='a'?'<div class=status>Обновляем товары: Техника для кухни</div>'+skeletons():productCards(refetch?'previous':'')}</div></main>`}
const states=[['Начальная загрузка','Загружаем товары'],['Refetch A → B','Обновляем выбранную группу'],['Все товары · пусто','В магазине пока нет товаров'],['Группа · пусто','Показать все товары'],['Ошибка групп','Категории недоступны · Повторить'],['Ошибка товаров','Не удалось загрузить · Повторить'],['Обе ошибки','Два раздельных повтора'],['Повтор успешен','24 товара · текущая группа']];
function matrix(){return `<section class=matrix><div class=matrix-title><h1>${variant==='a'?'A · Context shield':'B · Confirmed transition'}</h1><span>${mobile?'375 × 812':'1440 × 1000'} · state matrix</span></div><div class=tiles>${states.map((s,i)=>`<article class=tile><h2>${s[0]}</h2>${i===4||i===5||i===6?`<div class=minierror>${s[1]}<br><span class=miniaction>Повторить</span></div>`:`<div class=minihead></div><div class=miniline></div><div class=minicards><div class=minicard></div><div class=minicard></div><div class=minicard></div><div class=minicard></div></div>`}<span class=tag>${s[1]}</span></article>`).join('')}</div></section>`}
function interactions(){return `<section class=interaction><h1>${variant==='a'?'A · Context shield':'B · Confirmed transition'} · catalogue interaction</h1><div class=interaction-grid><div class=demo><h2>Триггер и варианты группы</h2><div class=states><div class=sample>Каталог · rest</div><div class="sample hover">Каталог · hover</div><div class="sample focus">Каталог · keyboard focus</div><div class="sample selected">✓ Смартфоны · selected</div><div class="sample hover">Компьютеры · hover</div><div class="sample focus">ТВ, аудио и домашние кинотеатры · focus</div></div><div class=flow><b>${mobile?'Modal sheet':'Non-modal panel'}</b><br>Открыть → ${variant==='a'?'selected option':'trigger / close first'} → выбрать или закрыть → вернуть focus в «Каталог»</div></div><div class=notes><h2>Контракт</h2><ol><li>Повторный trigger, Escape, selection и explicit close закрывают.</li><li>${mobile?'Backdrop закрывает; page inert; focus trapped.':'Outside click закрывает; focus не trapped.'}</li><li>↑ ↓ Home End перемещают по группам.</li><li>Исчезнувшая группа → focus в «Все товары».</li><li>Sticky close + внутренний scroll; длинные имена переносятся.</li><li>Reduced motion: мгновенное открытие, без shimmer.</li></ol><div class=callout>SR: «Каталог товаров», expanded, selected/pressed, busy, scoped errors and retry, polite result announcement.</div></div></div></section>`}
document.body.innerHTML=artifact==='matrix'?matrix():artifact==='interactions'?interactions():overview();
</script>
</body>
</html>
