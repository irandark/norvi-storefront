<app-catalog-header
  [navigationOpen]="navigationOpen()"
  [mobileViewport]="mobileViewport()"
  (toggleRequested)="toggleNavigation($event)"
/>

@if (navigationOpen()) {
  <app-catalog-navigation
    [groupsState]="facade.groupsState()"
    [groups]="facade.groups()"
    [selection]="facade.selection()"
    [mobileViewport]="mobileViewport()"
    [trigger]="trigger()"
    (closeRequested)="closeNavigation()"
    (retry)="facade.retryGroups()"
    (selectAll)="selectAll()"
    (selectGroup)="facade.selectGroup($event); closeNavigation()"
  />
}

<main class="storefront" [attr.inert]="navigationOpen() && mobileViewport() ? '' : null">
  <nav class="breadcrumbs" aria-label="Хлебные крошки"><span>Главная</span><span aria-hidden="true">/</span><span>Каталог</span></nav>
  <section class="catalog" aria-labelledby="catalog-title">
    <app-catalog-results
      [state]="facade.productsState()"
      [selection]="facade.selection()"
      [products]="facade.products()"
      [resultCount]="facade.resultCount()"
      (retry)="facade.retryProducts()"
      (showAll)="facade.selectAll()"
    />
  </section>
</main>

<p class="visually-hidden" role="status" aria-live="polite" aria-atomic="true">{{ facade.liveAnnouncement() }}</p>
